// 用 a 标签的 target="photoFrame" 把被点击的页面载入同名 iframe。
// JavaScript 仅用于同步高亮与图片名称，移除这段代码依然能正常切换大图。
(() => {
  const names = {t1:'雪山秋色',t2:'高山湖泊',t3:'草原河流',t4:'山间公路',t5:'日照雪峰',t6:'金色晚霞',t7:'海滨棕榈'};
  const label = document.getElementById('selected-label');
  document.querySelectorAll('.photo-link').forEach(link => {
    link.addEventListener('click', () => {
      const img = link.dataset.photo;
      document.querySelectorAll('.photo-link').forEach(item => item.setAttribute('aria-current', String(item.dataset.photo === img)));
      label.textContent = `当前图片：${img.toUpperCase()} · ${names[img]}`;
    });
  });
})();
</script></body></html>
